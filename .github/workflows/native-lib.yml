name: Native library builder

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            lib: libtweetnacl.so
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
            lib: libtweetnacl.so
          - os: macos-latest
            artifact: darwin-aarch64
            lib: libtweetnacl.dylib
          - os: macos-15-intel
            artifact: darwin-amd64
            lib: libtweetnacl.dylib
          - os: windows-latest
            artifact: windows-amd64
            lib: tweetnacl.dll
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25
    - name: Build native library (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: make jni
    - name: Build native library (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        export PATH="/c/msys64/mingw64/bin:$PATH"
        mkdir -p build
        javac -h jni -d build src/peergos/server/crypto/JniTweetNacl.java
        JAVA_HOME_UNIX=$(cygpath -u "$JAVA_HOME")
        gcc -O2 -Wimplicit-function-declaration -fPIC -std=c11 \
          -I"$JAVA_HOME_UNIX/include" -I"$JAVA_HOME_UNIX/include/win32" \
          -Inative -Ijni -shared -o tweetnacl.dll \
          jni/peergos_server_crypto_JniTweetNacl.c -lbcrypt
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: "./${{ matrix.lib }}"
